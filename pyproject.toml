[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum_kc"
version = "0.1.0"
description = "Hybrid quantum-classical keratoconus diagnostic pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "pennylane>=0.38",
    "pennylane-lightning>=0.38",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "mlflow>=2.10",
    "Pillow>=10.0",
    "matplotlib>=3.8"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantum_kc*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
